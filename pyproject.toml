[project]
name = "kebivo"
version = "0.5.1"
description = "Kebivo self-hosted knowledge feedback router"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.20.1",
  "argon2-cffi==23.1.0",
  "cryptography==50.0.2",
  "fastapi==0.165.0",
  "httpx==0.28.1",
  "mcp==2.3.0",
  # Floor for GHSA-mf5v-w3w3-f6cg; mcp and fastapi pull it in unpinned.
  "opentelemetry-api>=1.45.2",
  "sqlalchemy==2.1.9",
  "starlette==1.10.0",
  "uvicorn[standard]==0.54.0",
]

[project.optional-dependencies]
dev = [
  "aiosmtpd==1.4.6",
  "langchain-core==1.8.4",
  "kebivo-client",
  "mypy==1.20.2",
  "pytest==8.4.2",
  "ruff==0.17.6",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kebivo"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["kebivo"]

[tool.pytest.ini_options]
testpaths = ["kebivo/tests"]
addopts = "-q"

[tool.uv.sources]
kebivo-client = { path = "sdk/python", editable = true }
