[project]
name = "kebivo"
version = "0.1.1"
description = "Kebivo self-hosted knowledge feedback router"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.16.1",
  "argon2-cffi==23.1.0",
  "cryptography==50.0.2",
  "fastapi==0.143.3",
  "httpx==0.28.1",
  "mcp==2.3.0",
  "sqlalchemy==2.0.41",
  "starlette==1.8.0",
  "uvicorn[standard]==0.34.2",
]

[project.optional-dependencies]
dev = [
  "aiosmtpd==1.4.6",
  "langchain-core==1.7.0",
  "mypy==1.15.0",
  "pytest==8.3.5",
  "ruff==0.11.8",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kebivo"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["kebivo"]

[tool.pytest.ini_options]
testpaths = ["kebivo/tests"]
addopts = "-q"
