services:
  app:
    build:
      context: .
      args:
        KEBIVO_VERSION: ${KEBIVO_VERSION:-local}
        KEBIVO_REVISION: ${KEBIVO_REVISION:-unknown}
    command: ["uvicorn", "kebivo.app:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    image: kebivo:${KEBIVO_VERSION:-local}
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8000}:8000"
    environment:
      APP_ENV: production
      DATABASE_URL: sqlite:////data/app.sqlite3
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY to a random value of at least 32 characters}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY to 64 random hex characters}
      ENCRYPTION_KEY_PREVIOUS: ${ENCRYPTION_KEY_PREVIOUS:-}
      WORKER_ENABLED: ${WORKER_ENABLED:-true}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
      WORKER_POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS:-1}
      WORKER_SHUTDOWN_GRACE_SECONDS: ${WORKER_SHUTDOWN_GRACE_SECONDS:-20}
      DELIVERY_RETRY_SCHEDULE_SECONDS: ${DELIVERY_RETRY_SCHEDULE_SECONDS:-30,120,600,1800,7200}
      DELIVERY_RETRY_AFTER_MAX_SECONDS: ${DELIVERY_RETRY_AFTER_MAX_SECONDS:-7200}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}
      FEEDBACK_RATE_LIMIT_PER_TOKEN: ${FEEDBACK_RATE_LIMIT_PER_TOKEN:-120}
      FEEDBACK_RATE_LIMIT_PER_IP: ${FEEDBACK_RATE_LIMIT_PER_IP:-300}
      IDEMPOTENCY_WINDOW_HOURS: ${IDEMPOTENCY_WINDOW_HOURS:-24}
      FEEDBACK_RETENTION_DAYS: ${FEEDBACK_RETENTION_DAYS:-180}
      DELIVERY_LOG_RETENTION_DAYS: ${DELIVERY_LOG_RETENTION_DAYS:-30}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-90}
      MCP_ENABLED: ${MCP_ENABLED:-true}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-}
    volumes:
      - app-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  app-data:
