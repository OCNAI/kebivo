name: Release candidate (private artifact)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version from pyproject.toml (x.y.z)
        required: true
      previous_ref:
        description: Previous release tag or Phase 6 gate commit
        required: true
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
        with:
          version: '0.13.1'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make install
      - name: Check candidate without publishing
        env:
          VERSION: ${{ github.event.inputs.version || github.ref_name }}
          PREVIOUS_REF: ${{ github.event.inputs.previous_ref || vars.KEBIVO_PREVIOUS_REF }}
        run: |
          VERSION="${VERSION#v}"
          make release-check VERSION="$VERSION" PREVIOUS_REF="$PREVIOUS_REF"
      - name: Save candidate image
        run: docker save "kebivo:$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')" -o kebivo-image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: kebivo-candidate-image
          path: kebivo-image.tar
          retention-days: 7
      # Owner approval is required before setting KEBIVO_PUBLISH. No registry
      # namespace or release assets are configured in this private workflow.
      - name: Publishing is disabled pending owner approval
        if: vars.KEBIVO_PUBLISH == 'true'
        run: |
          echo 'Publishing requires a separately reviewed workflow and owner-approved registry.' >&2
          exit 1
