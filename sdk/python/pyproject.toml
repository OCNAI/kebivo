[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "kebivo-client"
version = "0.2.0"
description = "Standard library client for the Kebivo feedback API"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
langchain = ["langchain-core>=1.0,<2"]

[tool.hatch.build.targets.wheel]
packages = ["kebivo_client"]
